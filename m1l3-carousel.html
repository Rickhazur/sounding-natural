<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame Carousel — Module 1 · Lesson 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#026A79;--teal2:#49ADB3;--amber:#E8AA28;--ink:#123C46;--muted:#5b6f75;--bg:#f2f8f8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:34px 12px;min-height:100vh}
.head{text-align:center;margin-bottom:8px}
.head h2{font-family:'Sora';font-weight:800;font-size:clamp(20px,4vw,28px);color:var(--teal)}
.head p{color:var(--muted);font-size:14px;margin-top:6px}
.counter{text-align:center;font-family:'Sora';font-weight:800;color:var(--teal);font-size:14px;letter-spacing:.12em;margin:14px 0 4px}
.counter b{color:var(--amber);font-size:18px}
.car{position:relative;max-width:920px;margin:0 auto;min-height:540px;touch-action:pan-y}
.car-track{position:relative;height:500px;perspective:1400px}
.pcard{position:absolute;top:0;left:50%;width:min(400px,88%);margin-left:min(-200px,-44%);background:#fff;border-radius:24px;padding:30px 28px 26px;box-shadow:0 18px 50px rgba(2,106,121,.18);border-top:6px solid var(--teal);transition:transform .55s cubic-bezier(.34,1.3,.5,1),opacity .45s;will-change:transform}
.pcard .num{position:absolute;top:-19px;left:24px;background:var(--amber);color:#3a2a05;font-family:'Sora';font-weight:800;font-size:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(232,170,40,.5)}
.pcard h3{font-family:'Sora';font-size:22px;font-weight:800;margin:8px 0 4px;color:var(--teal)}
.grp{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,var(--teal),#0396a8);border-radius:999px;padding:4px 12px;margin:0 6px 12px 0}
.packbox{background:#eef7f4;border:1px solid #c5e6dc;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.55;color:#0d5a43;margin-bottom:12px}
.triobox{background:#eef1fb;border:1px solid #ccd4f5;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.55;color:#2c3a7a;margin-bottom:12px}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.formula b{background:#e8f4f5;color:var(--teal);font-size:12.5px;padding:6px 11px;border-radius:8px;font-weight:700}
.formula b.hot{background:#fdf0d3;color:#8a5a00}
.ex{background:#f6fbfb;border-left:4px solid var(--amber);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px;line-height:1.55;margin-bottom:12px}
.key{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.audiodock{display:flex;align-items:center;gap:12px;background:#eef6f6;border-radius:14px;padding:10px 14px}
.abtn{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),#0396a8);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 5px 14px rgba(2,106,121,.35);display:grid;place-items:center;transition:transform .15s}
.abtn:active{transform:scale(.92)}
.abtn .eq{display:none;align-items:flex-end;gap:2.5px;height:18px}
.abtn .eq i{width:3.5px;background:#fff;border-radius:2px;animation:eq .7s ease-in-out infinite}
.abtn .eq i:nth-child(2){animation-delay:.15s}.abtn .eq i:nth-child(3){animation-delay:.3s}.abtn .eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:6px}50%{height:17px}}
.abtn.playing .tr{display:none}.abtn.playing .eq{display:flex}
.abtn.slowbtn{width:40px;height:40px;font-size:16px;background:linear-gradient(135deg,#49ADB3,#026A79)}
.abtn.slowbtn.playing{outline:3px solid var(--amber);outline-offset:2px}
.audiodock span{font-size:13px;font-weight:600;color:var(--muted)}
.car-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.arrow{width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:0 6px 18px rgba(2,106,121,.18);font-size:20px;cursor:pointer;color:var(--teal);transition:all .2s}
.arrow:hover{background:var(--teal);color:#fff;transform:scale(1.08)}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:320px}
.dots button{width:11px;height:11px;border-radius:50%;border:none;background:#c4d8da;cursor:pointer;transition:all .25s;padding:0}
.dots button.on{background:var(--amber);transform:scale(1.4)}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:12px}
@media (max-width:560px){.car{min-height:580px}.car-track{height:540px}.arrow{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}.abtn .eq i{animation:none}}
</style>
</head>
<body>
<div class="head">
  <h2>🖼️ Discover: Framing Your Message — 10 frames</h2>
  <p>Swipe the packaging playbook — tap 🐇 on any card to hear it. Watch the moment pill and the 🔍 clarify-trio cards.</p>
</div>
<div class="counter"><b id="cnum">1</b> / 10</div>
<div class="car"><div class="car-track" id="track"></div></div>
<div class="car-nav">
  <button class="arrow" onclick="move(-1)" aria-label="Previous frame">←</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" onclick="move(1)" aria-label="Next frame">→</button>
</div>
<p class="hint">👆 drag or swipe &nbsp;·&nbsp; ← → keys work too</p>

<script>
const PATTERNS=[
 {n:'01',name:"Here's the thing:",grp:'🗺️ FRAME · open the message',pack:'🖼️ PACKAGING, not content: the frame does the packaging job, the ___ slot carries the content. Launch the frame while the content is still forming — this is the PRODUCIR payoff.',trio:null,f:['Here’s','the thing:','+','your key point'],hot:[1],ex:"Here's the thing: we need two more weeks.",key:'The flag before the point. Signals “pay attention, this is the point” — then you fill in the content.'},
 {n:'02',name:'Let me put it this way:',grp:'🗺️ FRAME · open the message',pack:null,trio:'🔍 The clarify trio (3 of 3): “What I’m trying to say” = groping for the words (bear with me) · “What I mean” = correcting what you just said · “Let me put it this way” = a deliberate, simpler rephrase.',f:['Let me put it','this way:','+','a simpler version'],hot:[1],ex:'Let me put it this way: our current plan is too slow.',key:'The deliberate rephrase — you CHOOSE a cleaner version on purpose. Not groping, not fixing: upgrading.'},
 {n:'03',name:"What I'm trying to say is",grp:'🔧 CLARIFY · repair live',pack:null,trio:'🔍 The clarify trio (1 of 3): use this one when you’re GROPING — the words aren’t there yet. Not for correcting (that’s card 4) or rephrasing (card 2).',f:["What I'm trying",'to say is','+','the message, forming'],hot:[1],ex:"What I'm trying to say is the report isn't ready yet.",key:'The groper — buys thinking time while signaling the message IS coming. Launch it mid-sentence, then let the content arrive.'},
 {n:'04',name:'What I mean is',grp:'🔧 CLARIFY · repair live',pack:null,trio:'🔍 The clarify trio (2 of 3): use this one when you’re CORRECTING — something you already said needs fixing. Not for groping (card 3) or rephrasing (card 2).',f:['What I mean','is','+','the corrected version'],hot:[0],ex:'What I mean is we should wait for the client.',key:'The corrector — refines or fixes what you just said. Its job is repair, not grammar: it keeps you talking instead of stopping to apologize.'},
 {n:'05',name:'As far as I know,',grp:'🛡️ SOFTEN · hedge honestly',pack:null,trio:null,f:['As far as','I know,','+','the fact (limits marked)'],hot:[1],ex:'As far as I know, the contract ends in June.',key:'The honest hedge — marks the LIMIT of your knowledge. Hedge honestly, never as filler: it earns its place by doing real pragmatic work.'},
 {n:'06',name:'To be fair,',grp:'🛡️ SOFTEN · hedge honestly',pack:null,trio:null,f:['To be fair,','+','the balancing consideration'],hot:[0],ex:'To be fair, the team worked very hard on this.',key:'The balancer — adds a fair consideration before or after a tough point. Softens without weakening.'},
 {n:'07',name:'The good news is',grp:'📰 DELIVER · the news',pack:null,trio:null,f:['The good news','is','+','the news'],hot:[0],ex:'The good news is we finished ahead of schedule.',key:'Half of the professional update skeleton: good news and bad news delivered with the same frame family.'},
 {n:'08',name:'The bad news is',grp:'📰 DELIVER · the news',pack:null,trio:null,f:['The bad news','is','+','the news'],hot:[0],ex:'The bad news is the budget is over.',key:'Bad news lands professionally when it’s packaged — never dropped bare.'},
 {n:'09',name:'The problem is',grp:'📰 DELIVER · the news',pack:null,trio:null,f:['The problem','is','+','the issue'],hot:[0],ex:"The problem is we don't have enough data.",key:'The issue-namer: clean, direct, no blame. Not an accusation, not a complaint — just the problem, framed.'},
 {n:'10',name:'What happens next is',grp:'🔭 PROJECT · forward',pack:null,trio:null,f:['What happens next','is','+','the next step'],hot:[0],ex:'What happens next is we meet the client on Monday.',key:'The forward-projector — ends any update with direction. Its job is managing the conversation forward, not grammar.'}
];
const track=document.getElementById('track'),dots=document.getElementById('dots'),cnum=document.getElementById('cnum');
let cur=0;
PATTERNS.forEach((p,i)=>{
  const d=document.createElement('div');d.className='pcard';
  d.innerHTML=`<span class="num">${i+1}</span><h3>${p.name}</h3>
   <span class="grp">${p.grp}</span>
   ${p.pack?`<div class="packbox">${p.pack}</div>`:''}${p.trio?`<div class="triobox">${p.trio}</div>`:''}
   <div class="formula">${p.f.map((x,j)=>`<b class="${p.hot.includes(j)?'hot':''}">${x}</b>`).join('')}</div>
   <div class="ex">“${p.ex}”</div><p class="key">🔑 ${p.key}</p>
   <div class="audiodock"><button class="abtn" aria-label="Hear ${p.name}"><span class="tr">🐇</span><span class="eq"><i></i><i></i><i></i><i></i></span></button><button class="abtn slowbtn" aria-label="Hear ${p.name} slowly">🐢</button><span>🐇 natural · 🐢 slow</span></div>`;
  d.querySelector('.abtn').onclick=(e)=>{e.stopPropagation();toggleAudio('m1l3-audio-'+p.n+'.mp3',d.querySelector('.abtn'));};
  d.querySelector('.slowbtn').onclick=(e)=>{e.stopPropagation();toggleAudio('m1l3-audio-'+p.n+'-slow.mp3',d.querySelector('.slowbtn'))};
  track.appendChild(d);
  const b=document.createElement('button');b.setAttribute('aria-label','Go to frame '+(i+1));b.onclick=()=>go(i);dots.appendChild(b);
});
/* audio: one at a time */
let curA=null,curB=null;
function toggleAudio(file,btn){
  if(curA&&!curA.paused&&curB===btn){curA.pause();btn.classList.remove('playing');return;}
  if(curA){curA.pause();if(curB)curB.classList.remove('playing');}
  curA=new Audio(file);curB=btn;btn.classList.add('playing');
  curA.onended=()=>btn.classList.remove('playing');
  curA.onerror=()=>{btn.classList.remove('playing');};
  curA.play().catch(()=>btn.classList.remove('playing'));
}
/* coverflow */
function layout(){
  const cards=track.children;
  for(let i=0;i<cards.length;i++){
    const off=i-cur,c=cards[i],ax=Math.min(Math.abs(off),3);
    c.style.transform=`translateX(${off*62}%) scale(${1-ax*0.14}) translateZ(${-ax*160}px) rotateY(${off===0?0:(off>0?-14:14)}deg)`;
    c.style.opacity=ax>2?0:(1-ax*0.28);
    c.style.zIndex=20-ax;
    c.style.pointerEvents=Math.abs(off)>2?'none':'auto';
  }
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  cnum.textContent=cur+1;
}
function go(i){cur=(i+PATTERNS.length)%PATTERNS.length;layout();}
function move(d){go(cur+d);}
layout();
/* swipe + keys */
let sx=null;
track.addEventListener('pointerdown',e=>{sx=e.clientX;});
window.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)move(dx<0?1:-1);});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);});
</script>
</body>
</html>
