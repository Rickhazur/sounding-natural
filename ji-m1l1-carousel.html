<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Carousel — Lesson 1 · Your CV in English · Job Interviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#026A79;--teal2:#49ADB3;--amber:#E8AA28;--ink:#123C46;--muted:#5b6f75;--bg:#f2f8f8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:34px 12px;min-height:100vh}
.head{text-align:center;margin-bottom:8px}
.head h2{font-family:'Sora';font-weight:800;font-size:clamp(20px,4vw,28px);color:var(--teal)}
.head p{color:var(--muted);font-size:14px;margin-top:6px}
.counter{text-align:center;font-family:'Sora';font-weight:800;color:var(--teal);font-size:14px;letter-spacing:.12em;margin:14px 0 4px}
.counter b{color:var(--amber);font-size:18px}
.car{position:relative;max-width:920px;margin:0 auto;min-height:560px;touch-action:pan-y}
.car-track{position:relative;height:520px;perspective:1400px}
.pcard{position:absolute;top:0;left:50%;width:min(400px,88%);margin-left:min(-200px,-44%);background:#fff;border-radius:24px;padding:30px 28px 26px;box-shadow:0 18px 50px rgba(2,106,121,.18);border-top:6px solid var(--teal);transition:transform .55s cubic-bezier(.34,1.3,.5,1),opacity .45s;will-change:transform}
.pcard .num{position:absolute;top:-19px;left:24px;background:var(--amber);color:#3a2a05;font-family:'Sora';font-weight:800;font-size:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(232,170,40,.5)}
.pcard h3{font-family:'Sora';font-size:22px;font-weight:800;margin:8px 0 4px;color:var(--teal)}
.reg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:#e8f4f5;border-radius:999px;padding:4px 12px;margin-bottom:12px}
.grp{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,var(--teal),#0396a8);border-radius:999px;padding:4px 12px;margin:0 6px 12px 0}
.func{background:#eaf3fd;border:1px solid #bcd0f5;border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.55;color:#14365f;margin-bottom:12px;font-weight:700}
.func b{color:var(--teal)}
.bridge{background:#eaf6ff;border:1px solid #bcdcf5;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.55;color:#0d4a63;margin-bottom:12px}
.warnbox{background:#fdf0d3;border:1px solid #f0d9a8;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.55;color:#7a5200;margin-bottom:12px}
.ex{background:#f6fbfb;border-left:4px solid var(--amber);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px;line-height:1.55;margin-bottom:8px}
.ex mark{background:#ffe9ad;padding:1px 5px;border-radius:5px;font-weight:700}
.gloss{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;font-style:italic}
.key{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.audiodock{display:flex;align-items:center;gap:12px;background:#eef6f6;border-radius:14px;padding:10px 14px}
.abtn{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),#0396a8);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 5px 14px rgba(2,106,121,.35);display:grid;place-items:center;transition:transform .15s}
.abtn:active{transform:scale(.92)}
.abtn .eq{display:none;align-items:flex-end;gap:2.5px;height:18px}
.abtn .eq i{width:3.5px;background:#fff;border-radius:2px;animation:eq .7s ease-in-out infinite}
.abtn .eq i:nth-child(2){animation-delay:.15s}.abtn .eq i:nth-child(3){animation-delay:.3s}.abtn .eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:6px}50%{height:17px}}
.abtn.playing .tr{display:none}.abtn.playing .eq{display:flex}
.abtn.slowbtn{width:40px;height:40px;font-size:16px;background:linear-gradient(135deg,#49ADB3,#026A79)}
.abtn.slowbtn.playing{outline:3px solid var(--amber);outline-offset:2px}
.audiodock span{font-size:13px;font-weight:600;color:var(--muted)}
.car-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.arrow{width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:0 6px 18px rgba(2,106,121,.18);font-size:20px;cursor:pointer;color:var(--teal);transition:all .2s}
.arrow:hover{background:var(--teal);color:#fff;transform:scale(1.08)}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:320px}
.dots button{width:11px;height:11px;border-radius:50%;border:none;background:#c4d8da;cursor:pointer;transition:all .25s;padding:0}
.dots button.on{background:var(--amber);transform:scale(1.4)}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:12px}
@media (max-width:560px){.car{min-height:600px}.car-track{height:560px}.arrow{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}.abtn .eq i{animation:none}}
</style>
</head>
<body>
<div class="head">
  <h2>🎤 Discover: Your CV in English — 10 interview chunks</h2>
  <p>Your your cv in english playbook — every card leads with WHAT the chunk does. Tap ▶ to hear it. Watch the pitfall warnings.</p>
</div>
<div class="counter"><b id="cnum">1</b> / 10</div>
<div class="car"><div class="car-track" id="track"></div></div>
<div class="car-nav">
  <button class="arrow" onclick="move(-1)" aria-label="Previous pattern">←</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" onclick="move(1)" aria-label="Next pattern">→</button>
</div>
<p class="hint">👆 drag or swipe &nbsp;·&nbsp; ← → keys work too</p>

<script>
const PATTERNS=[
 {n:'01',name:'Led a team of __',grp:'👥 Leadership',reg:'📝 Written · CV',func:'⚡ DOES: <b>states leadership scope</b> — with a number (numbers are the credibility).',bridge:null,warnbox:'⚠️ Adjective BEFORE the noun: <i>a cross-functional team</i> — never <i>a team cross-functional</i>.',ex:'“<mark>Led a team of</mark> twelve engineers across three countries.”',gloss:'«Lideré un equipo de» — el número es la prueba.',key:'Recruiters scan for scope first. "Led a team of 12" beats "responsible for team leadership" — verbs beat nouns on a CV.'},
 {n:'02',name:'Responsible for __',grp:'📋 Role & Teamwork',reg:'📝 Written · CV',func:'⚡ DOES: <b>describes duties</b> — in formal CV register.',bridge:null,warnbox:'⚠️ <i>Responsible <b>FOR</b></i> — jamás <i>responsible of</i>. The Spanish calque is the #1 fossil here.',ex:'“<mark>Responsible for</mark> a portfolio worth two million dollars.”',gloss:'«Responsable de» — cuidado con la preposición.',key:'Formal and safe — but pair every "responsible for" with a results bullet. Duties alone don’t sell.'},
 {n:'03',name:'Increased __ by __%',grp:'🎯 Impact & Results',reg:'📝 Written · CV',func:'⚡ DOES: <b>quantifies a win</b> — the verb recruiters scan for first.',bridge:null,warnbox:null,ex:'“<mark>Increased</mark> sales <mark>by thirty percent</mark> in one year.”',gloss:'«Aumenté… en un…%» — el verbo del logro.',key:'The increase/decrease pair is the CV’s engine. No number = no proof. Even an estimate ("~20%") beats silence.'},
 {n:'04',name:'Reduced __ by __',grp:'🎯 Impact & Results',reg:'📝 Written · CV',func:'⚡ DOES: <b>quantifies savings or efficiency</b> — the inseparable partner of "increased".',bridge:null,warnbox:null,ex:'“<mark>Reduced</mark> costs <mark>by fifteen percent</mark> without cutting staff.”',gloss:'«Reduje… en un…» — ahorro o eficiencia.',key:'"Without cutting staff" turns a cold number into judgment. Results + how = the full story.'},
 {n:'05',name:'Spearheaded __',grp:'👥 Leadership',reg:'📝 Written · CV',func:'⚡ DOES: <b>claims ownership of an initiative</b> — stronger and more alive than "led".',bridge:null,warnbox:null,ex:'“<mark>Spearheaded</mark> the migration to a new learning platform.”',gloss:'«Encabecé / impulsé» — verbo con agencia.',key:'The pedagogue replaced "Utilized" here — the most inflated, empty verb in corporate English. "Spearheaded" says the same with real agency.'},
 {n:'06',name:'Delivered __ on time and under budget',grp:'🎯 Impact & Results',reg:'📝 Written · CV',func:'⚡ DOES: <b>signals operational reliability</b> — in a single block.',bridge:null,warnbox:null,ex:'“<mark>Delivered</mark> the product launch <mark>on time and under budget</mark>.”',gloss:'«Entregué… a tiempo y por debajo del presupuesto».',key:'The two things every hiring manager fears you won’t do — answered in one line.'},
 {n:'07',name:'Collaborated with cross-functional teams',grp:'📋 Role & Teamwork',reg:'📝 Written · CV',func:'⚡ DOES: <b>shows teamwork</b> — without sounding generic.',bridge:null,warnbox:'⚠️ Adjective BEFORE the noun: <i>cross-functional teams</i> — the fossilized order is <i>teams cross-functional</i>.',ex:'“<mark>Collaborated with cross-functional teams</mark> across four time zones.”',gloss:'«Colaboré con equipos multifuncionales».',key:'"Across four time zones" makes it concrete. "Team player" is a claim; this is evidence.'},
 {n:'08',name:'Managed a budget of __',grp:'👥 Leadership',reg:'📝 Written · CV',func:'⚡ DOES: <b>states financial scope</b> — with precision.',bridge:null,warnbox:null,ex:'“<mark>Managed a budget of</mark> five hundred thousand dollars.”',gloss:'«Administré un presupuesto de».',key:'Money scope = seniority signal. Even a small budget stated precisely beats a vague "managed resources".'},
 {n:'09',name:'Recognized for __',grp:'🏅 Proof',reg:'📝 Written · CV',func:'⚡ DOES: <b>cites recognition</b> — without bragging.',bridge:null,warnbox:null,ex:'“<mark>Recognized for</mark> exceeding targets three years in a row.”',gloss:'«Reconocido/a por» — el mérito, sin presumir.',key:'Third-party proof ("recognized for") carries more weight than self-praise ("excellent at").'},
 {n:'10',name:'Proven track record in __',grp:'🏅 Proof',reg:'📝 Written · CV',func:'⚡ DOES: <b>summarizes reliability</b> — the CV’s closing line.',bridge:null,warnbox:'⚠️ <i>Proven</i> (adjective) — never <i>proved track record</i>.',ex:'“<mark>Proven track record in</mark> turning around underperforming teams.”',gloss:'«Historial comprobado en» — el cierre.',key:'Save it for the summary — one use per CV. And it’s PROVen (adjective), never "proved".'}
];
const track=document.getElementById('track'),dots=document.getElementById('dots'),cnum=document.getElementById('cnum');
let cur=0;
PATTERNS.forEach((p,i)=>{
  const d=document.createElement('div');d.className='pcard';
  d.innerHTML=`<span class="num">${i+1}</span><h3>${p.name}</h3>
   <span class="grp">${p.grp}</span><span class="reg">${p.reg}</span>
   <div class="func">${p.func}</div>
   ${p.bridge?`<div class="bridge">${p.bridge}</div>`:''}${p.warnbox?`<div class="warnbox">${p.warnbox}</div>`:''}
   <div class="ex">“${p.ex}”</div><div class="gloss">${p.gloss}</div><p class="key">🔑 ${p.key}</p>
   <div class="audiodock"><button class="abtn" aria-label="Hear ${p.name}"><span class="tr">▶</span><span class="eq"><i></i><i></i><i></i><i></i></span></button><button class="abtn slowbtn" aria-label="Hear ${p.name} slowly">🐢</button><span>▶ natural · 🐢 slow</span></div>`;
  d.querySelector('.abtn').onclick=(e)=>{e.stopPropagation();toggleAudio('ji-m1l1-audio-'+p.n+'.mp3',d.querySelector('.abtn'));};
  d.querySelector('.slowbtn').onclick=(e)=>{e.stopPropagation();toggleAudio('ji-m1l1-audio-'+p.n+'-slow.mp3',d.querySelector('.slowbtn'))};
  track.appendChild(d);
  const b=document.createElement('button');b.setAttribute('aria-label','Go to pattern '+(i+1));b.onclick=()=>go(i);dots.appendChild(b);
});
/* audio: one at a time */
let curA=null,curB=null;
function toggleAudio(file,btn){
  if(curA&&!curA.paused&&curB===btn){curA.pause();btn.classList.remove('playing');return;}
  if(curA){curA.pause();if(curB)curB.classList.remove('playing');}
  curA=new Audio(file);curB=btn;btn.classList.add('playing');
  curA.onended=()=>btn.classList.remove('playing');
  curA.onerror=()=>{btn.classList.remove('playing');};
  curA.play().catch(()=>btn.classList.remove('playing'));
}
/* coverflow */
function layout(){
  const cards=track.children;
  for(let i=0;i<cards.length;i++){
    const off=i-cur,c=cards[i],ax=Math.min(Math.abs(off),3);
    c.style.transform=`translateX(${off*62}%) scale(${1-ax*0.14}) translateZ(${-ax*160}px) rotateY(${off===0?0:(off>0?-14:14)}deg)`;
    c.style.opacity=ax>2?0:(1-ax*0.28);
    c.style.zIndex=20-ax;
    c.style.pointerEvents=Math.abs(off)>2?'none':'auto';
  }
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  cnum.textContent=cur+1;
}
function go(i){cur=(i+PATTERNS.length)%PATTERNS.length;layout();}
function move(d){go(cur+d);}
layout();
/* swipe + keys */
let sx=null;
track.addEventListener('pointerdown',e=>{sx=e.clientX;});
window.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)move(dx<0?1:-1);});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);});
</script>
</body>
</html>
