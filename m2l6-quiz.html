<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Final Exam — Module 2 · Capstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#026A79;--teal2:#49ADB3;--amber:#E8AA28;--ink:#123C46;--muted:#5b6f75;--bg:#f2f8f8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:30px 14px;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px}
.hidden{display:none!important}
.panel{background:#fff;border-radius:26px;padding:44px 34px;text-align:center;box-shadow:0 18px 50px rgba(2,106,121,.16)}
.emoji-big{font-size:64px;margin-bottom:14px}
.panel h2{font-family:'Sora';font-weight:800;font-size:clamp(24px,5vw,32px);color:var(--teal);margin-bottom:10px}
.panel p{color:var(--muted);line-height:1.65;margin-bottom:8px}
.panel .rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.panel .rules span{background:#eef6f6;color:var(--teal);font-weight:700;font-size:13px;padding:8px 15px;border-radius:999px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--teal),#0396a8);color:#fff;font-family:'Sora';font-weight:800;font-size:16px;padding:15px 44px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 10px 26px rgba(2,106,121,.35);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.02)}
.hud{display:flex;gap:10px;margin-bottom:12px}
.hud-box{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 4px 14px rgba(2,106,121,.10)}
.hud-box .label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hud-box .value{font-family:'Sora';font-weight:800;font-size:20px;color:var(--teal)}
.pbar{height:8px;background:#dcebeb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),var(--amber));border-radius:99px;transition:width .4s}
.qcard{background:#fff;border-radius:24px;padding:34px 28px;box-shadow:0 18px 50px rgba(2,106,121,.16);text-align:center}
.sit{background:#f6fbfb;border-left:4px solid var(--teal);border-radius:0 12px 12px 0;padding:14px 16px;font-size:17px;line-height:1.55;margin-bottom:20px;text-align:left;font-weight:600}
.sit .ltag{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.q{font-family:'Sora';font-weight:800;font-size:19px;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{background:#f2f8f8;border:2px solid #e2efef;border-radius:14px;padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--ink);text-align:left;line-height:1.5}
.opt:hover:not(.disabled){border-color:var(--teal2);transform:translateY(-1px)}
.opt.disabled{cursor:default;opacity:.75}
.opt.correct{background:#e5f6ec;border-color:#2e9e5b;color:#14532d}
.opt.wrong{background:#fdecec;border-color:#d64545;color:#7a1f1f}
.feedback{display:none;margin-top:18px;border-radius:14px;padding:16px;font-size:14.5px;line-height:1.65;text-align:left}
.feedback.show{display:block}
.feedback.good{background:#e5f6ec;border:1px solid #bfe6cd}
.feedback.bad{background:#fdf3e3;border:1px solid #f0d9a8}
#nb .btn{margin-top:16px;font-size:15px;padding:13px 36px}
#stars{font-size:40px;margin:10px 0;letter-spacing:6px}
#finalScore{font-family:'Sora';font-weight:800;font-size:26px;color:var(--teal);margin:6px 0}
@media (prefers-reduced-motion:reduce){}
</style>
</head>
<body>
<div class="wrap">

  <div id="startScreen" class="panel">
    <div class="emoji-big">🏆</div>
    <h2>The Final Exam</h2>
    <p>Fifty patterns. <b>One voice.</b></p>
    <p>Fifteen new professional situations — three from each lesson. Prove your advanced voice.</p>
    <div class="rules"><span>🏆 15 questions</span><span>📚 all 5 lessons</span><span>🔥 streak bonus</span></div>
    <button class="btn" onclick="startGame()">START ▶</button>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="hud">
      <div class="hud-box"><div class="label">Question</div><div class="value" id="qnum">1/15</div></div>
      <div class="hud-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="hud-box"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
    </div>
    <div class="pbar"><i id="pfill"></i></div>
    <div class="qcard">
      <div class="sit"><span class="ltag" id="ltag"></span><span id="sit"></span></div>
      <p class="q">Choose the best version:</p>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div id="nb"></div>
    </div>
  </div>

  <div id="endScreen" class="panel hidden">
    <div class="emoji-big" id="endEmoji">🎓</div>
    <h2>🎓 Module 2 Complete</h2>
    <div id="stars">⭐⭐⭐</div>
    <div id="finalScore">0 points</div>
    <p id="endMsg"></p>
    <button class="btn" onclick="startGame()" style="margin-top:14px">Try again ↻</button>
  </div>

</div>
<script>
const Q=[
 {lt:'L1 · Emphasis',sit:'Emphasize who solved the crisis:',opts:['It was Ana who solved the crisis.','It was Ana solved the crisis.','Ana was who solved the crisis.'],ok:0,pat:'It-cleft',key:'“It was X who…” — the relative clause needs “who”.'},
 {lt:'L1 · Emphasis',sit:'Emphasize what the client wants:',opts:['What the client wants is faster delivery.','What the client wants it is faster delivery.','That the client wants is faster delivery.'],ok:0,pat:'What-cleft',key:'“What + clause + be + key info” — no extra pronoun.'},
 {lt:'L1 · Emphasis',sit:'Emphasize the deadline emotionally:',opts:['This deadline we cannot miss.','This deadline we cannot to miss.','This deadline cannot we miss.'],ok:0,pat:'Fronting',key:'Fronted object + normal word order — no inversion here.'},
 {lt:'L2 · Passive & Reporting',sit:'Report the launch neutrally:',opts:['The product was launched yesterday.','The product launched yesterday by us.','The product got launched yesterday.'],ok:0,pat:'Agentless passive',key:'No agent — the action matters, not who did it.'},
 {lt:'L2 · Passive & Reporting',sit:'Your boss: “Finish the report today.” Report it:',opts:['She told me to finish the report today.','She said me to finish the report today.','She told to finish the report today.'],ok:0,pat:'Reported requests',key:'Tell + PERSON + to-infinitive. Never “she said me”.'},
 {lt:'L2 · Passive & Reporting',sit:'You hired a designer for the logo:',opts:['We had the logo designed by a professional.','We had designed the logo by a professional.','We got design the logo by a professional.'],ok:0,pat:'Causative have',key:'Have + object + past participle — you arrange it, they do it.'},
 {lt:'L3 · Inversion',sit:'Open your speech with impact:',opts:['Never have we faced a bigger opportunity.','Never we have faced a bigger opportunity.','Never did we have faced a bigger opportunity.'],ok:0,pat:'Never + inversion',key:'Fronted “never” forces the aux–subject swap.'},
 {lt:'L3 · Inversion',sit:'State the policy:',opts:['Under no circumstances should guests enter the server room.','Under no circumstances guests should enter the server room.','Under no circumstances should guests enters the server room.'],ok:0,pat:'Under no circumstances',key:'Opener + modal + subject — then the base verb.'},
 {lt:'L3 · Inversion',sit:'Highlight the double win:',opts:['Not only did we win the bid, but we set a record.','Not only we won the bid, but we set a record.','Not only did we won the bid, but we set a record.'],ok:0,pat:'Not only... but also',key:'Invert the first clause only; “did” + base verb, never “did won”.'},
 {lt:'L4 · Conditionals',sit:'Advise about the merger:',opts:['If I were you, I’d wait for the audit.','If I would be you, I’d wait for the audit.','If I were you, I will wait for the audit.'],ok:0,pat:'Second conditional',key:'“Would” lives in the result clause only.'},
 {lt:'L4 · Conditionals',sit:'Regret the late launch:',opts:['If we had tested more, we’d have launched cleanly.','If we would have tested more, we’d have launched cleanly.','If we had tested more, we had launched cleanly.'],ok:0,pat:'Third conditional',key:'“Would” NEVER goes in the if-clause.'},
 {lt:'L4 · Conditionals',sit:'Warn about the budget:',opts:['We must cut costs; otherwise, we’ll run out by June.','We must cut costs; if not, we’ll run out by June.','We must cut costs; otherwise, we run out by June.'],ok:0,pat:'Otherwise',key:'The if-less conditional — “or” for speech, “otherwise” for writing.'},
 {lt:'L5 · Modals',sit:'Explain the empty office:',opts:['They must have left early.','They must leave early.','They mustn’t have left early.'],ok:0,pat:'Must have + pp',key:'Confident past deduction — and “mustn’t have” doesn’t exist for this.'},
 {lt:'L5 · Modals',sit:'Criticize the missing backup:',opts:['We should have saved a backup.','We should save a backup.','We should have save a backup.'],ok:0,pat:'Should have + pp',key:'Regret about the past — “should have” + past participle.'},
 {lt:'L5 · Modals',sit:'Speculate on the delay:',opts:['The supplier might have missed the shipment.','The supplier might miss the shipment.','The supplier must of missed the shipment.'],ok:0,pat:'Might have + pp',key:'Past possibility — and it’s “might HAVE”, never “must of”.'}
];
let order,qi,score,streak,answered;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle([...Array(Q.length).keys()]);qi=0;score=0;streak=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  showQ();
}
function showQ(){
  answered=false;
  const q=Q[order[qi]];
  document.getElementById('qnum').textContent=(qi+1)+'/'+Q.length;
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak+(streak>=3?' 🔥':'');
  document.getElementById('pfill').style.width=(qi/Q.length*100)+'%';
  document.getElementById('ltag').textContent=q.lt;
  document.getElementById('sit').textContent=q.sit;
  const idx=shuffle([0,1,2]);
  const box=document.getElementById('opts');box.innerHTML='';
  idx.forEach(k=>{
    const b=document.createElement('button');b.className='opt';b.textContent=q.opts[k];
    b.onclick=()=>answer(k===q.ok,b);box.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.className='feedback';fb.innerHTML='';
  document.getElementById('nb').innerHTML='';
}
function answer(ok,el){
  if(answered)return;answered=true;
  const q=Q[order[qi]],fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  if(ok){
    const pts=10+streak*5;score+=pts;streak++;
    el.classList.add('correct');
    fb.className='feedback show good';
    fb.innerHTML=`✅ <strong>Correct! +${pts} points — ${q.pat}</strong><br>🔑 ${q.key}`;
  }else{
    streak=0;el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.opts[q.ok])o.classList.add('correct');});
    fb.className='feedback show bad';
    fb.innerHTML=`❌ Not quite — the best version is <strong>“${q.opts[q.ok]}”</strong><br>🔑 ${q.pat}: ${q.key}`;
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak+(streak>=3?' 🔥':'');
  document.getElementById('nb').innerHTML=`<button class="btn" onclick="nextQ()">${qi+1<Q.length?'Next question →':'See my diploma 🎓'}</button>`;
}
function nextQ(){qi++;if(qi>=Q.length)endGame();else showQ();}
function endGame(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const pct=score/(Q.length*10);let stars,emoji,msg;
  if(pct>=1.2){stars='⭐⭐⭐';emoji='🎓';msg='Outstanding! Fifty patterns, one voice — you are an advanced speaker. Module 2 is yours.';}
  else if(pct>=0.8){stars='⭐⭐⭐';emoji='🎉';msg='Excellent! Your advanced voice is ready for the real world. Congratulations!';}
  else if(pct>=0.5){stars='⭐⭐';emoji='💪';msg='Good! Revisit The Arsenal to sharpen the weak spots, then graduate in style.';}
  else{stars='⭐';emoji='📚';msg='Keep training! Review the five lessons and take the exam again.';}
  document.getElementById('endEmoji').textContent=emoji;
  document.getElementById('stars').textContent=stars;
  document.getElementById('finalScore').textContent=score+' points';
  document.getElementById('endMsg').textContent=msg;
}
</script>
</body>
</html>
