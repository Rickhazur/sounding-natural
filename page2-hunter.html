<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hunter — Sounding Natural</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#fff;color:#123C46;max-width:800px;margin:0 auto;padding:20px}
.header{background:#E69600;color:#fff;border-radius:20px;padding:24px;text-align:center;margin-bottom:24px}
.header h1{font-size:28px;font-weight:800}
.header p{font-size:16px;margin-top:8px}
.scorebar{display:flex;justify-content:space-between;font-weight:700;color:#E69600;margin-bottom:16px;font-size:18px}
.card{background:#FFF8E7;border-radius:16px;padding:24px;margin-bottom:20px;border:2px solid #E69600}
.card h2{font-size:20px;font-weight:700;color:#E69600;margin-bottom:12px}
.sentence{font-size:22px;font-weight:600;margin:16px 0;line-height:1.6}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.word{background:#fff;border:2px solid #E69600;border-radius:10px;padding:10px 16px;font-size:18px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
.word.link{background:#026A79;color:#fff;border-color:#026A79}
.word.stress{background:#E69600;color:#fff;border-color:#E69600}
.btn{background:#E69600;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px;font-family:'Montserrat',sans-serif;margin:6px}
.btn:hover{background:#d08600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.teal{background:#026A79}
.legend{display:flex;gap:16px;margin:12px 0;font-size:15px;font-weight:600}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.feedback{border-radius:12px;padding:16px;margin-top:16px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.good{background:#d4edda;color:#155724}
.feedback.bad{background:#f8d7da;color:#721c24}
.explain{font-weight:400;margin-top:8px;font-size:15px}
.hidden{display:none}
.final{text-align:center;padding:40px 20px}
.final h2{font-size:32px;color:#E69600;margin-bottom:16px}
</style>
</head>
<body>
<div class="header">
<h1>🏹 THE HUNTER</h1>
<p>Listen ONCE. Hunt the links 🔗 and the stress 💪 before the audio ends!</p>
</div>
<div class="scorebar"><span id="prog">Sentence 1 of 4</span><span>Score: <span id="score">0</span></span></div>
<div id="game"></div>
<div class="final hidden" id="final">
<div style="font-size:64px">🏹</div>
<h2>Hunt Complete!</h2>
<p id="fscore" style="font-size:20px;font-weight:700"></p>
<p id="rank" style="margin-top:12px"></p>
</div>
<script>
const AUDIO_BASE = "";
const data=[
{audio:"new-pron-04-FINAL.mp3",text:"That I cannot accept.",words:["That","I","cannot","accept."],
link:[],stress:[0,3],mode:"tap",
explain:"No linking here — the front word THAT hits hard. STRESS: THAT, acCEPT."},
{audio:"new-pron-05-FINAL.mp3",text:"Should you change your mind, let me know.",words:["Should","you","change","your","mind,","let","me","know."],
link:[2,3],stress:[0,2,7],mode:"tap",
explain:"LINK: change + your. STRESS: SHOULD, CHANGE, KNOW."},
{audio:"new-pron-06-FINAL.mp3",text:"Hardly had she spoken when the phone rang.",words:["Hardly","had","she","spoken","when","the","phone","rang."],
link:[],stress:[0,3,7],mode:"tap",
explain:"First word HARDly hits hard. STRESS: HARDly, SPOken, RANG."},
{audio:"new-pron-07-FINAL.mp3",text:"Rarely have I heard such nonsense.",words:["Rarely","have","I","heard","such","nonsense."],
link:[],stress:[0,3,5],mode:"tap",
explain:"RAREly explodes, HEARD shines. STRESS: RAREly, HEARD, NONsense."}
];
let cur=0,score=0,played=false;
function render(){
const s=data[cur];
document.getElementById('prog').textContent=`Sentence ${cur+1} of ${data.length}`;
const g=document.getElementById('game');
g.innerHTML=`<div class="card"><h2>🎯 Target ${cur+1}</h2>
<p class="sentence">"${s.text}"</p>
<div class="legend"><span><span class="dot" style="background:#026A79"></span>Click once = LINK 🔗</span><span><span class="dot" style="background:#E69600"></span>Click twice = STRESS 💪</span></div>
<button class="btn" id="playBtn" onclick="play()">▶ Play once</button>
<div class="words" id="w"></div>
<button class="btn teal" onclick="check()">Check my hunt</button>
<div class="feedback" id="fb"></div><div id="nx"></div></div>`;
const w=document.getElementById('w');
s.words.forEach((wd,i)=>{
const d=document.createElement('span');d.className='word';d.textContent=wd;d.dataset.clicks=0;
d.onclick=()=>{let c=(parseInt(d.dataset.clicks)+1)%3;d.dataset.clicks=c;
d.classList.remove('link','stress');if(c===1)d.classList.add('link');if(c===2)d.classList.add('stress');};
w.appendChild(d);});
}
function play(){
if(played)return;played=true;
document.getElementById('playBtn').disabled=true;
new Audio(AUDIO_BASE+data[cur].audio).play();
}
function check(){
const s=data[cur];let pts=0;let total=(s.link.length+s.stress.length)*10;
document.querySelectorAll('.word').forEach((e,i)=>{
const c=parseInt(e.dataset.clicks);
if(c===1&&s.link.includes(i))pts+=10;
if(c===2&&s.stress.includes(i))pts+=10;
});
score+=pts;document.getElementById('score').textContent=score;
const fb=document.getElementById('fb');
const pct=total?Math.round(pts/total*100):100;
if(pct>=80){fb.className='feedback show good';}
else{fb.className='feedback show bad';}
fb.innerHTML=`${pct>=80?'✅ Great hunt!':'🔍 Good try!'} You got ${pts}/${total} points.<div class="explain">${s.explain}</div>`;
document.getElementById('nx').innerHTML=`<button class="btn" onclick="next()">Next target →</button>`;
}
function next(){cur++;played=false;
if(cur>=data.length){
document.getElementById('game').classList.add('hidden');
document.querySelector('.scorebar').classList.add('hidden');
const f=document.getElementById('final');f.classList.remove('hidden');
document.getElementById('fscore').textContent=`Final score: ${score}`;
let r=score>=140?"🏆 Master Hunter!":score>=100?"🥈 Sharp Hunter!":"🥉 Keep practicing!";
document.getElementById('rank').textContent=r;
}else render();
}
render();
</script>
</body>
</html>
