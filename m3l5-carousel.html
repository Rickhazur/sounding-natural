<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗡️ The Arsenal — Module 3 · Final Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#026A79;--teal2:#49ADB3;--amber:#E8AA28;--ink:#123C46;--muted:#5b6f75;--bg:#f2f8f8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:34px 14px;min-height:100vh}
.wrap{max-width:1020px;margin:0 auto}
.eyebrow{text-align:center;font-family:'Sora';font-weight:800;font-size:12px;letter-spacing:.28em;color:var(--teal2);margin-bottom:10px}
.head{text-align:center;margin-bottom:8px}
.head h2{font-family:'Sora';font-weight:800;font-size:clamp(22px,4vw,30px);color:var(--teal)}
.head p{color:var(--muted);font-size:14px;margin-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:20px 0 6px}
.pill{border:2px solid #dcebeb;background:#fff;color:var(--teal);font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .2s}
.pill:hover{border-color:var(--teal2)}
.pill.active{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(2,106,121,.3)}
.search{border:2px solid #dcebeb;background:#fff;border-radius:999px;padding:9px 18px;font-size:13.5px;font-family:'Inter';color:var(--ink);width:230px;outline:none}
.search:focus{border-color:var(--teal2)}
.counter{text-align:center;font-family:'Sora';font-weight:800;color:var(--teal);font-size:14px;letter-spacing:.12em;margin:16px 0}
.counter b{color:var(--amber);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ccard{background:#fff;border-radius:22px;padding:24px 22px 20px;box-shadow:0 12px 34px rgba(2,106,121,.12);border-top:6px solid var(--teal)}
.ccard h3{font-family:'Sora';font-size:20px;font-weight:800;color:var(--ink);margin:10px 0 14px;line-height:1.4}
.lpill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px}
.lpill.L1{background:#e8f4f5;color:#026A79}
.lpill.L2{background:#eaf3fb;color:#0d5f7a}
.lpill.L3{background:#fdf0d3;color:#8a5a00}
.lpill.L4{background:#e6f6f4;color:#04707e}
.audiodock{display:flex;align-items:center;gap:12px;background:#eef6f6;border-radius:14px;padding:10px 14px}
.abtn{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),#0396a8);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 5px 14px rgba(2,106,121,.35);display:grid;place-items:center;transition:transform .15s}
.abtn:active{transform:scale(.92)}
.abtn .eq{display:none;align-items:flex-end;gap:2.5px;height:18px}
.abtn .eq i{width:3.5px;background:#fff;border-radius:2px;animation:eq .7s ease-in-out infinite}
.abtn .eq i:nth-child(2){animation-delay:.15s}.abtn .eq i:nth-child(3){animation-delay:.3s}.abtn .eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:6px}50%{height:17px}}
.abtn.playing .tr{display:none}.abtn.playing .eq{display:flex}
.abtn.slowbtn{width:40px;height:40px;font-size:16px;background:linear-gradient(135deg,#49ADB3,#026A79)}
.abtn.slowbtn.playing{outline:3px solid var(--amber);outline-offset:2px}
.audiodock span{font-size:13px;font-weight:600;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:15px}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
@media (prefers-reduced-motion:reduce){.abtn .eq i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">MODULE 3 · FINAL MISSION</div>
  <div class="head">
    <h2>🗡️ The Arsenal</h2>
    <p>All 40 chunks of Module 3 — filter by lesson, tap to hear.</p>
  </div>
  <div class="toolbar" id="pills"></div>
  <div class="toolbar"><input class="search" id="search" type="text" placeholder="🔍 Search chunks…" aria-label="Search chunks"></div>
  <div class="counter">Showing <b id="count">40</b> of 40</div>
  <div class="grid" id="grid"></div>
  <p class="hint">🐇 natural speed &nbsp;·&nbsp; 🐢 slow speed</p>
</div>
<script>
const LESSONS={
 L1:{icon:'🎯',name:'The Pitch'},
 L2:{icon:'📖',name:'The Storyteller'},
 L3:{icon:'🔥',name:'The Hot Seat'},
 L4:{icon:'🍸',name:'The Mixer'}
};
const CHUNKS=[
 {l:'L1',n:'01',t:"From my perspective,"},
 {l:'L1',n:'02',t:"The way I see it,"},
 {l:'L1',n:'03',t:"If you ask me,"},
 {l:'L1',n:'04',t:"I'm inclined to believe…"},
 {l:'L1',n:'05',t:"As far as I'm concerned,"},
 {l:'L1',n:'06',t:"Have you considered…?"},
 {l:'L1',n:'07',t:"The key thing here is…"},
 {l:'L1',n:'08',t:"What it comes down to is…"},
 {l:'L1',n:'09',t:"The bottom line is…"},
 {l:'L1',n:'10',t:"I'd strongly recommend…"},
 {l:'L2',n:'01',t:"Let me set the scene:"},
 {l:'L2',n:'02',t:"A little background first:"},
 {l:'L2',n:'03',t:"So there we were,"},
 {l:'L2',n:'04',t:"It all started when…"},
 {l:'L2',n:'05',t:"And that's when everything changed."},
 {l:'L2',n:'06',t:"And then, out of nowhere,"},
 {l:'L2',n:'07',t:"To cut a long story short,"},
 {l:'L2',n:'08',t:"In the end,"},
 {l:'L2',n:'09',t:"Looking back,"},
 {l:'L2',n:'10',t:"The moral of the story?"},
 {l:'L3',n:'01',t:"I need to be honest with you:"},
 {l:'L3',n:'02',t:"This isn't easy to say, but…"},
 {l:'L3',n:'03',t:"I see where you're coming from, but…"},
 {l:'L3',n:'04',t:"That's a fair point, but…"},
 {l:'L3',n:'05',t:"I'm afraid that's not possible."},
 {l:'L3',n:'06',t:"What I can do is…"},
 {l:'L3',n:'07',t:"I completely understand your frustration."},
 {l:'L3',n:'08',t:"Let's take a step back."},
 {l:'L3',n:'09',t:"Here's what I propose:"},
 {l:'L3',n:'10',t:"How can we make this work?"},
 {l:'L4',n:'01',t:"How's your week going?"},
 {l:'L4',n:'02',t:"What brings you here?"},
 {l:'L4',n:'03',t:"Did you come far?"},
 {l:'L4',n:'04',t:"How long have you been at…?"},
 {l:'L4',n:'05',t:"That sounds fascinating — how did you get into it?"},
 {l:'L4',n:'06',t:"What do you enjoy most about…?"},
 {l:'L4',n:'07',t:"It's great to finally meet you in person."},
 {l:'L4',n:'08',t:"I've been looking forward to meeting you."},
 {l:'L4',n:'09',t:"I won't keep you any longer —"},
 {l:'L4',n:'10',t:"Let's grab a coffee sometime."}
];
function audioFile(c,slow){return 'm3l'+c.l.slice(1)+'-audio-'+c.n+(slow?'-slow':'')+'.mp3';}
/* audio: one at a time */
let curA=null,curB=null;
function toggleAudio(file,btn){
  if(curA&&!curA.paused&&curB===btn){curA.pause();btn.classList.remove('playing');return;}
  if(curA){curA.pause();if(curB)curB.classList.remove('playing');}
  curA=new Audio(file);curB=btn;btn.classList.add('playing');
  curA.onended=()=>btn.classList.remove('playing');
  curA.onerror=()=>{btn.classList.remove('playing');};
  curA.play().catch(()=>btn.classList.remove('playing'));
}
/* filter pills */
const pillsEl=document.getElementById('pills');
let curFilter='ALL';
[['ALL','All (40)'],['L1','🎯 The Pitch (L1)'],['L2','📖 The Storyteller (L2)'],['L3','🔥 The Hot Seat (L3)'],['L4','🍸 The Mixer (L4)']].forEach(([k,label])=>{
  const b=document.createElement('button');b.className='pill'+(k==='ALL'?' active':'');b.textContent=label;
  b.onclick=()=>{curFilter=k;[...pillsEl.children].forEach(x=>x.classList.toggle('active',x===b));render();};
  pillsEl.appendChild(b);
});
document.getElementById('search').addEventListener('input',render);
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const grid=document.getElementById('grid');grid.innerHTML='';
  const list=CHUNKS.filter(c=>(curFilter==='ALL'||c.l===curFilter)&&(!q||c.t.toLowerCase().includes(q)));
  document.getElementById('count').textContent=list.length;
  if(!list.length){grid.innerHTML='<div class="empty">No chunks match — try another search.</div>';return;}
  list.forEach(c=>{
    const d=document.createElement('div');d.className='ccard';
    const meta=LESSONS[c.l];
    d.innerHTML=`<span class="lpill ${c.l}">${meta.icon} ${meta.name}</span><h3>${c.t}</h3>
    <div class="audiodock"><button class="abtn" aria-label="Hear ${c.t}"><span class="tr">🐇</span><span class="eq"><i></i><i></i><i></i><i></i></span></button><button class="abtn slowbtn" aria-label="Hear ${c.t} slowly"><span class="tr">🐢</span><span class="eq"><i></i><i></i><i></i><i></i></span></button><span>🐇 natural · 🐢 slow</span></div>`;
    d.querySelector('.abtn').onclick=()=>toggleAudio(audioFile(c,false),d.querySelector('.abtn'));
    d.querySelector('.slowbtn').onclick=()=>toggleAudio(audioFile(c,true),d.querySelector('.slowbtn'));
    grid.appendChild(d);
  });
}
render();
</script>
</body>
</html>
