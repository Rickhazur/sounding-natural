<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Quiz — Module 2 · Lesson 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#026A79;--teal2:#49ADB3;--amber:#E8AA28;--ink:#123C46;--muted:#5b6f75;--bg:#f2f8f8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:30px 14px;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px}
.hidden{display:none!important}
/* start + end screens */
.panel{background:#fff;border-radius:26px;padding:44px 34px;text-align:center;box-shadow:0 18px 50px rgba(2,106,121,.16)}
.emoji-big{font-size:64px;margin-bottom:14px}
.panel h2{font-family:'Sora';font-weight:800;font-size:clamp(24px,5vw,32px);color:var(--teal);margin-bottom:10px}
.panel p{color:var(--muted);line-height:1.65;margin-bottom:8px}
.panel .rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.panel .rules span{background:#eef6f6;color:var(--teal);font-weight:700;font-size:13px;padding:8px 15px;border-radius:999px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--teal),#0396a8);color:#fff;font-family:'Sora';font-weight:800;font-size:16px;padding:15px 44px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 10px 26px rgba(2,106,121,.35);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.02)}
/* HUD */
.hud{display:flex;gap:10px;margin-bottom:12px}
.hud-box{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 4px 14px rgba(2,106,121,.10)}
.hud-box .label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hud-box .value{font-family:'Sora';font-weight:800;font-size:20px;color:var(--teal)}
.pbar{height:8px;background:#dcebeb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),var(--amber));border-radius:99px;transition:width .4s}
/* question card */
.qcard{background:#fff;border-radius:24px;padding:34px 28px;box-shadow:0 18px 50px rgba(2,106,121,.16);text-align:center}
.draft{background:#f6fbfb;border-left:4px solid var(--amber);border-radius:0 12px 12px 0;padding:14px 16px;font-size:17px;line-height:1.55;margin-bottom:20px;text-align:left}
.draft .tag{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.q{font-family:'Sora';font-weight:800;font-size:19px;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{background:#f2f8f8;border:2px solid #e2efef;border-radius:14px;padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--ink);text-align:left;line-height:1.5}
.opt:hover:not(.disabled){border-color:var(--teal2);transform:translateY(-1px)}
.opt.disabled{cursor:default;opacity:.75}
.opt.correct{background:#e5f6ec;border-color:#2e9e5b;color:#14532d}
.opt.wrong{background:#fdecec;border-color:#d64545;color:#7a1f1f}
.feedback{display:none;margin-top:18px;border-radius:14px;padding:16px;font-size:14.5px;line-height:1.65;text-align:left}
.feedback.show{display:block}
.feedback.good{background:#e5f6ec;border:1px solid #bfe6cd}
.feedback.bad{background:#fdf3e3;border:1px solid #f0d9a8}
#nb .btn{margin-top:16px;font-size:15px;padding:13px 36px}
/* end */
#stars{font-size:40px;margin:10px 0;letter-spacing:6px}
#finalScore{font-family:'Sora';font-weight:800;font-size:26px;color:var(--teal);margin:6px 0}
@media (prefers-reduced-motion:reduce){}
</style>
</head>
<body>
<div class="wrap">

  <div id="startScreen" class="panel">
    <div class="emoji-big">🏆</div>
    <h2>Final Quiz</h2>
    <p>Eight new situations. <b>Transfer what you learned.</b></p>
    <p>No lesson examples here — real professional moments that demand inversion.</p>
    <div class="rules"><span>🏆 8 questions</span><span>🎯 transfer</span><span>🔥 streak bonus</span></div>
    <button class="btn" onclick="startGame()">START ▶</button>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="hud">
      <div class="hud-box"><div class="label">Question</div><div class="value" id="qnum">1/8</div></div>
      <div class="hud-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="hud-box"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
    </div>
    <div class="pbar"><i id="pfill"></i></div>
    <div class="qcard">
      <div class="draft"><span class="tag">🎯 Situation</span><span id="draft"></span></div>
      <p class="q">Choose the correct inversion:</p>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div id="nb"></div>
    </div>
  </div>

  <div id="endScreen" class="panel hidden">
    <div class="emoji-big" id="endEmoji">🏆</div>
    <h2>Quiz complete!</h2>
    <div id="stars">⭐⭐⭐</div>
    <div id="finalScore">0 points</div>
    <p id="endMsg"></p>
    <button class="btn" onclick="startGame()" style="margin-top:14px">Try again ↻</button>
  </div>

</div>
<script>
const R=[
 {sit:'Choose the correct inversion to open a speech about teamwork:',opts:['Never have I seen such teamwork.','Never I have seen such teamwork.','Never did I have seen such teamwork.'],ok:0,pat:'Never + inversion',key:'Fronted "never" forces aux–subject: have I, not I have.'},
 {sit:'In a report: growth like this is uncommon.',opts:['Rarely have we seen growth like this.','Rarely we have seen growth like this.','Rarely did we have seen growth like this.'],ok:0,pat:'Seldom / Rarely + inversion',key:'"Rarely" is the modern pick; inversion needs the aux: have we.'},
 {sit:'She closed the deal and impressed the board.',opts:['Not only did she close the deal, but she impressed the board.','Not only she closed the deal, but she impressed the board.','Not only did she closed the deal, but she impressed the board.'],ok:0,pat:'Not only... but also',key:'Invert the FIRST clause only — "but also" stays normal.'},
 {sit:'Policy: no phones in the lab.',opts:['Under no circumstances should phones enter the lab.','Under no circumstances phones should enter the lab.','Under no circumstances should phones enters the lab.'],ok:0,pat:'Under no circumstances',key:'Under no circumstances + modal + subject: should phones.'},
 {sit:'We arrived and the meeting started at once.',opts:['Hardly had we arrived when the meeting started.','Hardly we had arrived when the meeting started.','Hardly had we arrived than the meeting started.'],ok:0,pat:'Hardly / Scarcely... when',key:'"Hardly + had + subject + when" — never "than".'},
 {sit:'You understood only after reading the full report.',opts:['Only after reading the full report did I understand.','Only after reading the full report I understood.','Only after reading the full report did I understood.'],ok:0,pat:'Only + time + inversion',key:'The "only" phrase triggers inversion in the main clause.'},
 {sit:'The results were convincing; the board approved.',opts:['So convincing were the results that the board approved.','So convincing the results were that the board approved.','So were convincing the results that the board approved.'],ok:0,pat:'So / Such + inversion',key:'"So + adjective + be + subject + that" — full inversion.'},
 {sit:'Formal email closing: offer help.',opts:['Should you need anything, let me know.','Should you needed anything, let me know.','If should you need anything, let me know.'],ok:0,pat:'Should / Were / Had',key:'"Should you need" — standard formal email closing.'}
];
let order,qi,score,streak,answered;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle([...Array(R.length).keys()]);qi=0;score=0;streak=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  showQ();
}
function showQ(){
  answered=false;
  const r=R[order[qi]];
  document.getElementById('qnum').textContent=(qi+1)+'/'+R.length;
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak+(streak>=3?' 🔥':'');
  document.getElementById('pfill').style.width=(qi/R.length*100)+'%';
  document.getElementById('draft').textContent=r.sit;
  const idx=shuffle([0,1,2]);
  const box=document.getElementById('opts');box.innerHTML='';
  idx.forEach(k=>{
    const b=document.createElement('button');b.className='opt';b.textContent=r.opts[k];
    b.onclick=()=>answer(k===r.ok,b);box.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.className='feedback';fb.innerHTML='';
  document.getElementById('nb').innerHTML='';
}
function answer(ok,el){
  if(answered)return;answered=true;
  const r=R[order[qi]],fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  if(ok){
    const pts=10+streak*5;score+=pts;streak++;
    el.classList.add('correct');
    fb.className='feedback show good';
    fb.innerHTML=`✅ <strong>Correct! +${pts} points — ${r.pat}</strong><br>🔑 ${r.key}`;
  }else{
    streak=0;el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===r.opts[r.ok])o.classList.add('correct');});
    fb.className='feedback show bad';
    fb.innerHTML=`❌ Not quite — the correct version is <strong>“${r.opts[r.ok]}”</strong><br>🔑 ${r.pat}: ${r.key}`;
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak+(streak>=3?' 🔥':'');
  document.getElementById('nb').innerHTML=`<button class="btn" onclick="nextQ()">${qi+1<R.length?'Next question →':'See results 🏆'}</button>`;
}
function nextQ(){qi++;if(qi>=R.length)endGame();else showQ();}
function endGame(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const pct=score/(R.length*10);let stars,emoji,msg;
  if(pct>=1.2){stars='⭐⭐⭐';emoji='🏆';msg='Outstanding! Inversion is now part of your professional voice!';}
  else if(pct>=0.8){stars='⭐⭐⭐';emoji='🎉';msg='Excellent! You transfer inversion to new situations!';}
  else if(pct>=0.5){stars='⭐⭐';emoji='💪';msg='Good! Review the carousel, then try again!';}
  else{stars='⭐';emoji='📚';msg='Keep training! Review the patterns and try again.';}
  document.getElementById('endEmoji').textContent=emoji;
  document.getElementById('stars').textContent=stars;
  document.getElementById('finalScore').textContent=score+' points';
  document.getElementById('endMsg').textContent=msg;
}
</script>
</body>
</html>
